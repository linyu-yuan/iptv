name: Sync and Deduplicate IPTV

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Download, Deduplicate, and Filter
        run: |
          python - <<'PY'
          import re
          import sys
          import requests

          # 你的专属链接已直接写死在代码里
          url = "http://iptv.cqshushu.com/index.php?s=wy2Dag-lQ5eZ6YQaLBg6pg&t=multicast&channels=1&format=m3u"
          out = "gd_hotel_1080p.m3u"
          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}

          try:
              print("⬇️ 开始下载直播源...")
              resp = requests.get(url, headers=headers, timeout=30)
              resp.raise_for_status()
              text = resp.text
          except Exception as e:
              print(f"❌ 下载失败，保留上次文件: {e}")
              sys.exit(0)

          print("🧠 下载成功，开始去重和过滤...")
          lines = text.splitlines()
          
          channel_dict = {}
          current_extinf = ""
          current_name = ""

          for line in lines:
              line = line.strip()
              if not line: continue

              if line.startswith("#EXTINF"):
                  current_extinf = line
                  match = re.search(r'tvg-name="([^"]+)"', line)
                  current_name = match.group(1) if match else line.split(",")[-1].strip()
              elif line.startswith("#"):
                  continue
              else:
                  if current_name and current_extinf:
                      u = line
                      
                      # 1. 过滤 720p 及以下
                      if re.search(r'(720|576|480)[pP]?|标清|SD', current_extinf, re.I) or re.search(r'(720|576|480)', u, re.I):
                          current_extinf = ""
                          current_name = ""
                          continue
                      
                      # 2. 打分（码率最高者胜出）
                      score = 0
                      if re.search(r'1080|4k|hd|h265|hevc', u, re.I): score += 100
                      bitrate_match = re.search(r'[,&\/=](\d{3,5})[,&\/]', u)
                      if bitrate_match:
                          try: score += int(bitrate_match.group(1))
                          except: pass
                          
                      if current_name not in channel_dict or score > channel_dict[current_name]["score"]:
                          channel_dict[current_name] = {"extinf": current_extinf, "url": u, "score": score}
                          
                  current_extinf = ""
                  current_name = ""

          result_lines = ["#EXTM3U"]
          valid_count = 0
          for name, data in channel_dict.items():
              if data["score"] < 0: continue
              result_lines.append(data["extinf"])
              result_lines.append(data["url"])
              valid_count += 1

          with open(out, "w", encoding="utf-8") as f:
              f.write("\n".join(result_lines))
          print(f"✅ 处理完成！保留 {valid_count} 个优质频道。")
          PY

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add gd_hotel_1080p.m3u
          git diff --staged --quiet || git commit -m "Auto deduplicate & filter 720p $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push